[package]
name = "pagevision"
version.workspace = true
edition.workspace = true
# MPL-2.0 for the crate; the code adapted from oar-ocr-vl and PaddleOCR stays Apache-2.0
# (LICENSE-APACHE).
license = "MPL-2.0 AND Apache-2.0"
rust-version.workspace = true
description = "Page OCR with vision models: preprocessing, a llama.cpp backend and typed page results"
repository = "https://github.com/jordiboehme/rezzer"
readme = "README.md"
keywords = ["ocr", "vision", "llama-cpp", "document", "markdown"]
categories = ["multimedia::images", "text-processing"]

[features]
default = []
serde = ["dep:serde"]
# The llama.cpp backend. Native code: off by default, and CI never builds it.
llama = ["dep:llama-cpp-2"]
# The layout and text line detectors on Candle (CPU). Pure Rust, off by default.
detect = ["dep:candle-core", "dep:candle-nn", "dep:serde_json", "serde"]
# The page handle: the detectors plus Qwen through llama.cpp. Native code, so CI never builds it.
engine = ["llama", "detect"]

[dependencies]
serde = { workspace = true, optional = true, features = ["derive"] }
image.workspace = true
sha2.workspace = true
thiserror.workspace = true
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, optional = true, features = ["mtmd", "metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { workspace = true, optional = true, features = ["mtmd", "openmp"] }

[dev-dependencies]
# Reads the parity fixtures and the local bake-off numbers in tests/parity.rs, and writes the
# results file of examples/eval_run.rs.
serde_json.workspace = true
# Reads the test page manifests in examples/eval_run.rs.
toml.workspace = true

[[example]]
name = "eval_run"
required-features = ["detect", "serde"]
