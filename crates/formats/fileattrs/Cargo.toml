[package]
name = "fileattrs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reads where a file came from: binary plist string arrays, Zone.Identifier streams and extended attributes"
repository = "https://github.com/jordiboehme/rezzer"
documentation = "https://docs.rs/fileattrs"
readme = "README.md"
keywords = ["xattr", "plist", "provenance", "metadata", "forensics"]
categories = ["filesystem", "parser-implementations"]

[features]
# Writes extended attributes, for tests of this crate and of crates that use it. Off by
# default; nothing but dev-dependencies turns it on.
test-support = []

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
fileattrs = { path = ".", features = ["test-support"] }
tempfile.workspace = true
