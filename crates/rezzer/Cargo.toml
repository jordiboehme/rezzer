[package]
name = "rezzer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rezzer"
path = "src/main.rs"

[features]
default = ["fmt-text", "fmt-markdown", "fmt-csv"]
fmt-text = ["dep:rezzer-read-text"]
fmt-markdown = ["dep:rezzer-read-markdown"]
fmt-csv = ["dep:rezzer-read-csv"]

[dependencies]
rezzer-cli = { path = "../rezzer-cli" }
rezzer-read-text = { path = "../readers/rezzer-read-text", optional = true }
rezzer-read-markdown = { path = "../readers/rezzer-read-markdown", optional = true }
rezzer-read-csv = { path = "../readers/rezzer-read-csv", optional = true }
