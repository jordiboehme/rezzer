[package]
name = "rezzer-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rezzer-model = { path = "../rezzer-model" }
rezzer-limits = { path = "../rezzer-limits" }
rezzer-detect = { path = "../rezzer-detect" }
rezzer-enrich = { path = "../rezzer-enrich" }
rezzer-render = { path = "../rezzer-render" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
toml.workspace = true
directories.workspace = true
thiserror.workspace = true
# Atomic cache writes: a temporary file in the cache directory, then a rename.
tempfile.workspace = true

[dev-dependencies]
fileattrs = { path = "../formats/fileattrs", features = ["test-support"] }
rezzer-read-text = { path = "../readers/rezzer-read-text" }
rezzer-read-csv = { path = "../readers/rezzer-read-csv" }
rezzer-read-sheet = { path = "../readers/rezzer-read-sheet" }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
