[package]
name = "rezzer-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rezzer-model = { path = "../rezzer-model" }
rezzer-pipeline = { path = "../rezzer-pipeline" }
rezzer-render = { path = "../rezzer-render" }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, features = ["rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
base64.workspace = true
percent-encoding.workspace = true

[dev-dependencies]
rezzer-read-text = { path = "../readers/rezzer-read-text" }
rezzer-read-markdown = { path = "../readers/rezzer-read-markdown" }
rezzer-read-csv = { path = "../readers/rezzer-read-csv" }
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
tempfile.workspace = true
