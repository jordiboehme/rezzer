# The hostile tests stop themselves inside their limits. One that loops or hangs anyway is
# reported as slow after 60 seconds and ended after 3 minutes, so a regression fails the run
# instead of hanging it.
[[profile.default.overrides]]
filter = 'binary(hostile) | binary(hostile_render)'
slow-timeout = { period = "60s", terminate-after = 3 }

# These tests walk hostile shapes with no time stop, so only a work bound ends them. A broken
# bound loops: it is ended after 2 minutes and fails the run instead of hanging it.
[[profile.default.overrides]]
filter = 'package(pdfparts) & (binary(amplify) | binary(amplify_readers))'
slow-timeout = { period = "60s", terminate-after = 2 }

# The layout work bounds run with no time stop, count their steps of work and keep thread CPU
# time only as a 10 second safety stop. A broken bound loops: it is ended after 2 minutes and
# fails the run instead of hanging it.
[[profile.default.overrides]]
filter = 'package(sheetlayout)'
slow-timeout = { period = "60s", terminate-after = 2 }

# The Linux allocator probe and the hostile tests print their memory figures. nextest hides the
# output of a passing test, so these show it at once and a green CI log carries the numbers.
[[profile.default.overrides]]
filter = 'binary(linux_rss) | (package(rezzer) & binary(hostile))'
success-output = "immediate"

# The Linux allocator probe has no time stop inside its loops (small_exact_growth checks its
# 60 seconds afterwards). A run that hangs is ended after 2 minutes and fails instead.
[[profile.default.overrides]]
filter = 'binary(linux_rss)'
slow-timeout = { period = "60s", terminate-after = 2 }

# The decode tests scan with a 60 second safety stop a picture and bound their work by counted
# decoder calls. A run that turns slow is ended after 2 minutes and fails instead.
[[profile.default.overrides]]
filter = 'package(barcodes) & binary(decode)'
slow-timeout = { period = "60s", terminate-after = 2 }

# These tests bound their work by counted steps and keep the wall time only as a 60 second
# safety stop, checked when the call returns. A call that hangs is ended after 2 minutes and
# fails the run instead of hanging it.
[[profile.default.overrides]]
filter = '(package(sheetparts) & binary(odf)) | (package(rezzer-enrich) & binary(enrich)) | (package(csvsniff) & binary(csvsniff)) | (package(formulakit) & binary(logic)) | (package(rezzer-read-markdown) & binary(markdown)) | (package(rezzer-model) & binary(model)) | (package(rezzer-derez) & (binary(source) | binary(fit)))'
slow-timeout = { period = "60s", terminate-after = 2 }
