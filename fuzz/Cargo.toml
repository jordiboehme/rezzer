[package]
name = "rezzer-fuzz"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
rezzer-detect = { path = "../crates/rezzer-detect" }
rezzer-enrich = { path = "../crates/rezzer-enrich" }
rezzer-limits = { path = "../crates/rezzer-limits" }
rezzer-model = { path = "../crates/rezzer-model" }
rezzer-render = { path = "../crates/rezzer-render" }
rezzer-read-markdown = { path = "../crates/readers/rezzer-read-markdown" }
rezzer-read-csv = { path = "../crates/readers/rezzer-read-csv" }
rezzer-read-text = { path = "../crates/readers/rezzer-read-text" }
textenc = { path = "../crates/formats/textenc" }
csvsniff = { path = "../crates/formats/csvsniff" }
zipguard = { path = "../crates/formats/zipguard" }
formulakit = { path = "../crates/formats/formulakit" }
sheetparts = { path = "../crates/formats/sheetparts" }
rezzer-read-sheet = { path = "../crates/readers/rezzer-read-sheet" }
pdfparts = { path = "../crates/formats/pdfparts" }
barcodes = { path = "../crates/formats/barcodes" }
rezzer-read-pdf = { path = "../crates/readers/rezzer-read-pdf" }
# Builds the small packages of the part reader targets (stored entries only).
zip = { version = "=9.0.5", default-features = false }

# Not part of the workspace: cargo-fuzz needs nightly.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "detect"
path = "fuzz_targets/detect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "textenc_decode"
path = "fuzz_targets/textenc_decode.rs"
test = false
doc = false
bench = false

[[bin]]
