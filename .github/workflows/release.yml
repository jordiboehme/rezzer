name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual dry run (rehearsal): builds, signs when the secrets exist,
  # packages and stops short of publishing. Only a tag push publishes (the
  # `notes` job's `publish` output); a dispatch never does, also on a tag
  # ref. A failed tag run is retried with "Re-run failed jobs", which keeps
  # the push event.
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # The six release platforms, one "<target> <platform>" pair per line. The
  # `sbom` job reads both fields, `collect` builds the expected asset names
  # from the platform (windows-* ships a zip, the rest a tar.gz) and hands the
  # list to `attest-sboms`. strategy.matrix cannot read `env`, so the build
  # matrix below names the legs again: `collect` fails when the downloaded
  # rezzer-* archives are not exactly this list, so the two cannot drift
  # apart without a red run.
  RELEASE_PLATFORMS: |
    aarch64-apple-darwin macos-arm64
    x86_64-apple-darwin macos-intel
    x86_64-unknown-linux-musl linux-amd64
    aarch64-unknown-linux-musl linux-arm64
    x86_64-pc-windows-msvc windows-amd64
    aarch64-pc-windows-msvc windows-arm64

# Read only by default. The job that publishes names the scopes it needs in
# its own `permissions:` block.
permissions:
  contents: read

# One run per tag. A second push of the same tag waits for the first run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stops a tag push before any build when release-notes/<tag>.md is
  # missing, empty or does not open with the motto heading. Otherwise the
  # whole build matrix would run and fail only at the end, in `publish`.
  # A dispatched run on a branch has no tag and nothing to check, so the job
  # stays green and the rehearsal builds end to end without a notes file.
  # A dispatch on a tag ref runs both checks as the tag push would: a
  # rehearsal of a tag proves its notes file and version too.
  # The tag check against the crate version lives here too, so the build
  # legs (Windows among them) need neither jq nor a second copy of it.
  notes:
    name: verify the release notes file and the version
    # A toolchain install with its retries can take a few minutes.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version in every asset name: the tag, or v0.0.0-dev on a run
      # that is not on a tag (a dispatch on a tag ref rehearses with the
      # real names). build, sbom and collect read it as
      # needs.notes.outputs.version.
      # publish is the one gate for every tag-only step and job (the SBOM
      # attestations, publish with its signature, the tap push): true only
      # for a tag push. A dispatch on a tag ref also has ref_type tag, so
      # ref_type alone would let a rehearsal publish.
      # prerelease is true when the version has a suffix after a '-' (v0.2.0-rc.1,
      # and v0.0.0-dev): publish marks such a release as a pre-release, and
      # the homebrew job skips it, so only a plain release reaches the tap.
      - name: Resolve the release version and whether this run publishes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version=v0.0.0-dev
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            publish=true
          else
            publish=false
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "event $GITHUB_EVENT_NAME on $GITHUB_REF: version $version, publish $publish, prerelease $prerelease"
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # Runs on a dispatch too, so the dry run proves the cargo metadata path.
      - name: Install Rust toolchain
        shell: bash
        run: |
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 rustup toolchain install
          rustup show active-toolchain

      # A tag that disagrees with the crate version would ship a binary whose
      # --version lies about itself. The version comes from
      # [workspace.package], so cargo metadata reads it, not a grep. A
      # dispatched run has no tag: it prints the version and compares nothing.
      - name: Tag matches the crate version
        shell: bash
        run: |
          set -euo pipefail
          crate="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "rezzer") | .version')"
          [ -n "$crate" ] || { echo "::error::cargo metadata names no rezzer package"; exit 1; }
          echo "rezzer crate version: v$crate"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "not a tag, nothing to compare"
            exit 0
          fi
          if [ "v$crate" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the rezzer crate version v$crate"
            exit 1
          fi

      - name: The release notes file exists and opens with a motto heading
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "not a tag, nothing to verify"
            exit 0
          fi
          file="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$file" ]; then
            echo "::error file=$file::$file is missing or empty. Add it to main and push the tag again."
            exit 1
          fi
          if ! head -n1 "$file" | grep -qE '^# .*[^[:space:]]'; then
            echo "::error file=$file::$file must open with a level-one heading ('# ' and the release motto)."
            exit 1
          fi
          echo "release notes: $file"

  # THIRD-PARTY-NOTICES.txt for every archive: the licenses of the crates in
  # the rezzer binary for all six targets (cargo-about with about.toml and
  # about.hbs) and the notices of data bundled inside crates
  # (licenses/bundled-data.txt). Built once here, so every leg ships the same
  # file. The collect job downloads only the rezzer-* and sboms artifacts, so
  # this one does not become a release asset.
  notices:
    name: third-party notices
    needs: notes
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-about reads the dependency graph through cargo metadata.
      - name: Install Rust toolchain
        run: |
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 rustup toolchain install
          rustup show active-toolchain

      # `fallback: none` fails the step rather than downloading an unpinned
      # binary. The second step is the same install and runs only after the
      # first one failed (a bad network day).
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        id: about
        continue-on-error: true
        with:
          tool: cargo-about@0.9.3
          fallback: none

      - name: Wait before the second try
        if: ${{ steps.about.outcome == 'failure' }}
        run: sleep 30

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        if: ${{ steps.about.outcome == 'failure' }}
        with:
          tool: cargo-about@0.9.3
          fallback: none

      # No --target: the crates of all six targets (windows-sys among them)
      # must be in the registry for cargo-about to read their license files.
      - name: Fetch crates
        run: |
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 cargo fetch --locked

      # cargo-about runs online (the chrono workaround fetches its license
      # file), so the run retries. The script overwrites its output, so a
      # second try starts clean.
      - name: Write the notices
        run: |
          set -euo pipefail
          mkdir -p notices
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 3 \
            scripts/third-party-notices.sh notices/THIRD-PARTY-NOTICES.txt

      # The licenses and crates the file must name. A license id must end a
      # heading line "<name> (<id>)": a plain "MIT" also matches "LIMITED", and
      # a regex would read the "." in "Apache-2.0" as any character. The
      # bundled data is checked by lines from the copied texts, not by our own
      # summary at the top of bundled-data.txt. windows-sys proves the Windows
      # targets are in the graph.
      - name: Check the notices
        run: |
          set -euo pipefail
          file=notices/THIRD-PARTY-NOTICES.txt
          missing=0
          for id in MIT Apache-2.0 BSD-3-Clause; do
            awk -v want=" ($id)" '
              length($0) > length(want) && substr($0, length($0) - length(want) + 1) == want { found = 1 }
              END { exit !found }
            ' "$file" || { echo "::error::$file has no $id license"; missing=1; }
          done
          for text in 'Copyright 1990-2023 Adobe' 'Copyright 2014 PDFium Authors' \
            'Original code copyright 2014 Foxit Software Inc.' 'CC0 1.0 Universal'; do
            grep -qF -- "$text" "$file" || { echo "::error::$file lacks '$text'"; missing=1; }
          done
          for crate in rxing hayro-interpret calamine windows-sys; do
            grep -qE -- "^  - $crate [0-9]" "$file" \
              || { echo "::error::$file does not list the crate $crate"; missing=1; }
          done
          exit "$missing"

      - name: Upload the notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: notices/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  build:
    name: build (${{ matrix.platform }})
    needs: [notes, notices]
    # Same numbers as the notarize step: its worst case is 4830 s = 80.5 min and
    # its cap is 85 min. Add 30 min of build and signing before it (not measured),
    # 2 min of packaging after it and 20 min of slack: 137 min, inside the 140.
    timeout-minutes: 140
    runs-on: ${{ matrix.os }}
    # The Apple signing secrets belong in this environment, not in the
    # repository secrets, so only this job can read them. Restrict the
    # environment's deployments to main (the dry run) and v* tags. A
    # dispatch without the secrets builds unsigned macOS binaries with a
    # notice; a tag without them fails.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        # exe is the binary's file name, archive_ext the package format.
        # rustflags reaches the build through `env:`, never pasted into a
        # script. pe_machine is the COFF machine field the Windows binary must
        # carry (8664 for x64, aa64 for ARM64).
        include:
          - target: aarch64-apple-darwin
            platform: macos-arm64
            os: macos-latest
            archive_ext: tar.gz
            exe: rezzer
          - target: x86_64-apple-darwin
            platform: macos-intel
            # The last Intel image GitHub ships; it retires in August 2027.
            # Before then, cross-compile this leg on macos-latest instead.
            os: macos-15-intel
            archive_ext: tar.gz
            exe: rezzer
          # Static musl binaries, built natively on each architecture so the
          # smoke test runs the binary that ships. The workspace has no C
          # dependencies, so musl-tools is all the linker needs.
          - target: x86_64-unknown-linux-musl
            platform: linux-amd64
            os: ubuntu-latest
            archive_ext: tar.gz
            exe: rezzer
            musl: true
          - target: aarch64-unknown-linux-musl
            platform: linux-arm64
            os: ubuntu-24.04-arm
            archive_ext: tar.gz
            exe: rezzer
            musl: true
          # Native builds on each architecture, so the smoke test runs the
          # binary that ships. +crt-static links the C runtime into the
          # binary, so it runs without the Visual C++ redistributable.
          - target: x86_64-pc-windows-msvc
            platform: windows-amd64
            os: windows-latest
            archive_ext: zip
            exe: rezzer.exe
            rustflags: "-C target-feature=+crt-static"
            pe_machine: "8664"
          - target: aarch64-pc-windows-msvc
            platform: windows-arm64
            os: windows-11-arm
            archive_ext: zip
            exe: rezzer.exe
            rustflags: "-C target-feature=+crt-static"
            pe_machine: "aa64"
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      EXE: ${{ matrix.exe }}
    # Every step runs in bash, also on Windows (Git Bash), where the default
    # is PowerShell: the steps call scripts/ci/retry.sh and use bash quoting.
    # Only the Windows binary check and the zip steps say `shell: pwsh`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 rustup toolchain install
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 rustup target add "$TARGET"
          rustup show active-toolchain

      - name: Install musl-tools
        if: ${{ matrix.musl }}
        run: |
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 sudo apt-get update
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 sudo apt-get install -y musl-tools

      # No Rust cache in a release build: a tag run can only restore what
      # main saved, so a poisoned cache entry would end up in a shipped
      # binary.

      # cargo-auditable embeds the resolved dependency list in a section of
      # the binary (a few kB), so `cargo audit bin`, Trivy, Grype and
      # osv-scanner can name the crates inside a shipped binary later.
      # `fallback: none` fails the step rather than downloading an unpinned
      # binary.
      # The second step is the same install and runs only after the first
      # one failed (a bad network day).
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        id: auditable
        continue-on-error: true
        with:
          tool: cargo-auditable@0.7.7
          fallback: none

      - name: Wait before the second try
        if: ${{ steps.auditable.outcome == 'failure' }}
        run: sleep 30

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        if: ${{ steps.auditable.outcome == 'failure' }}
        with:
          tool: cargo-auditable@0.7.7
          fallback: none

      # The registry fetch is its own step so it can retry. --locked: a
      # lockfile that would need an update fails here.
      # `cargo fetch --target` fetches for the target only. If a leg ever
      # cross-compiles (host arch differs from target), recheck that the host
      # build dependencies are fetched.
      - name: Fetch crates
        run: |
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 cargo fetch --locked --target "$TARGET"

      # --frozen: Cargo.lock is the build's input and the crates are already
      # fetched, so the build neither re-resolves nor touches the network.
      # RUSTFLAGS is empty on the legs without matrix rustflags. An empty
      # value still overrides any rustflags a .cargo/config.toml might set
      # later, so such a file must move its flags into the matrix.
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo auditable build --release --frozen --target "$TARGET" -p rezzer

      - name: Smoke test
        shell: bash
        env:
          MUSL: ${{ matrix.musl }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/$EXE"
          [ -f "$bin" ] || { echo "::error::$bin is missing"; exit 1; }
          # The Windows images have no `file`; the next step reads the PE
          # header there instead.
          if [ "$MUSL" = "true" ] || [ "$RUNNER_OS" = "macOS" ]; then
            file "$bin"
          fi
          if [ "$MUSL" = "true" ]; then
            file "$bin" | grep -Eq 'statically linked|static-pie linked' \
              || { echo "::error::$bin is not statically linked"; exit 1; }
          fi
          "$bin" --version
          # pkgid ends in #<version> or #rezzer@<version>.
          pkgid="$(cargo pkgid --frozen -p rezzer)"
          crate="${pkgid##*[#@]}"
          said="$("$bin" --version | head -n1 | tr -d '\r')"
          if [ "$said" != "rezzer $crate" ]; then
            echo "::error::$bin --version says '$said', expected 'rezzer $crate'"
            exit 1
          fi

      # The machine field in the PE header proves the binary is built for this
      # leg's architecture. With +crt-static the binary must not import the
      # Visual C++ runtime DLL.
      - name: Check the Windows binary
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          PE_MACHINE: ${{ matrix.pe_machine }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "target/$env:TARGET/release/$env:EXE"
          $bytes = [System.IO.File]::ReadAllBytes($bin)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$bin has no MZ header" }
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550) { throw "$bin has no PE signature" }
          $machine = '{0:x4}' -f [BitConverter]::ToUInt16($bytes, $pe + 4)
          Write-Output "PE machine: $machine (expected $env:PE_MACHINE)"
          if ($machine -ne $env:PE_MACHINE) { throw "$bin is built for machine $machine, not $env:PE_MACHINE" }
          # A heuristic, not an import table parse: if it ever fires on a good
          # static binary, drop this check, not the +crt-static flag.
          $text = [System.Text.Encoding]::Latin1.GetString($bytes)
          if ($text.IndexOf('vcruntime140', [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
            throw "$bin names vcruntime140, so the C runtime is not linked in (+crt-static missing)"
          }

      # Sign the bare Mach-O with a Developer ID Application certificate
      # under the hardened runtime, then notarize it with notarytool. A bare
      # binary cannot carry a stapled ticket, so Gatekeeper checks online on
      # first run. A tag must ship signed binaries, so a tag without the six
      # secrets fails. A dispatched dry run without them builds unsigned
      # macOS binaries and says so. A partial set is always a mistake and
      # fails the build.
      - name: Decide whether to sign and notarize
        id: signing
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for var in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
                     APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!var:-}" ] || missing+=("$var")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -eq 6 ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::Apple signing secrets are not configured; a tag must ship signed and notarized macOS binaries"
              exit 1
            fi
            echo "::notice::Apple signing secrets are not configured; this build produces UNSIGNED macOS binaries"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Apple signing secrets missing (${missing[*]}); a partial secret set is always a misconfiguration"
            exit 1
          fi

      - name: Set up signing keychain
        if: ${{ steps.signing.outputs.sign == 'true' }}
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$cert"

      - name: Sign the binary
        if: ${{ steps.signing.outputs.sign == 'true' }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity found in the signing keychain"
            exit 1
          fi
          path="target/$TARGET/release/rezzer"
          identifier="io.github.jordiboehme.rezzer"
          # --force lets a retry re-sign a binary that a failed try already signed.
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 3 \
            codesign --force --timestamp --options runtime \
            --identifier "$identifier" \
            --keychain "$keychain" \
            --sign "$identity" \
            "$path"
          codesign --verify --strict --verbose=2 "$path"
          info="$(codesign --display --verbose=2 "$path" 2>&1)"
          echo "$info"
          grep -q "Identifier=$identifier" <<< "$info"
          grep -q "TeamIdentifier=${APPLE_TEAM_ID}" <<< "$info"
          grep -q "(runtime)" <<< "$info"

      - name: Notarize the binary
        if: ${{ steps.signing.outputs.sign == 'true' }}
        shell: bash
        # Worst case, in seconds: upload 3 x 300 + waits 5 + 10 = 915; wait
        # 3 x 1260 + 5 + 10 = 3795; log 120; total 4830 s = 80.5 min. The cap of
        # 85 min is a backstop above that, so the clean ::error:: always comes
        # first. Job: 30 min build and signing + 85 + 2 min packaging + 20 min
        # slack = 137 <= 140.
        timeout-minutes: 85
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc-key.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          zip="$RUNNER_TEMP/notarize-rezzer.zip"
          sub="$RUNNER_TEMP/notarize-submit.json"
          result="$RUNNER_TEMP/notarize-rezzer.json"
          ditto -c -k --keepParent "target/$TARGET/release/rezzer" "$zip"
          # notarytool --timeout only limits the polling, so every call also gets
          # a hard limit from perl's alarm. The redirect sits inside bash -c so the
          # ::warning:: lines of retry.sh stay out of the JSON; each try overwrites it.
          # Upload once (retried only for a failed upload), then wait on its id:
          # waiting again on the same id is safe and never queues a second upload.
          set +e
          # shellcheck disable=SC2016  # the $1..$3 are for the inner bash
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 3 bash -c 'perl -e "alarm shift; exec @ARGV" 300 xcrun notarytool submit "$1" --key "$2" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --no-wait --output-format json > "$3"' _ "$zip" "$key" "$sub"
          submit_rc=$?
          set -e
          cat "$sub" 2>/dev/null || true
          if ! jq -e 'type == "object" and (.id | type == "string")' "$sub" > /dev/null 2>&1; then
            echo "::error::notarization failed: upload returned no submission id (exit $submit_rc)"
            exit 1
          fi
          submission_id="$(jq -r '.id' "$sub")"
          set +e
          # shellcheck disable=SC2016  # the $1..$3 are for the inner bash
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 3 bash -c 'perl -e "alarm shift; exec @ARGV" 1260 xcrun notarytool wait "$1" --key "$2" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --timeout 20m --output-format json > "$3"' _ "$submission_id" "$key" "$result"
          wait_rc=$?
          set -e
          cat "$result" 2>/dev/null || true
          # The last try can leave nothing or no JSON object (timeout, network, crash).
          if ! jq -e 'type == "object"' "$result" > /dev/null 2>&1; then
            echo "::error::notarization failed: notarytool returned no JSON for submission $submission_id (exit $wait_rc)"
            exit 1
          fi
          status="$(jq -r '.status // "unknown"' "$result")"
          if [ "$wait_rc" -ne 0 ] || [ "$status" != "Accepted" ]; then
            echo "::error::notarization failed (notarytool exit $wait_rc, status $status)"
            perl -e 'alarm shift; exec @ARGV' 120 xcrun notarytool log "$submission_id" \
              --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
            exit 1
          fi
          rm -f "$zip"

      - name: Smoke test the signed binary
        if: ${{ steps.signing.outputs.sign == 'true' }}
        run: target/"$TARGET"/release/"$EXE" --version

      - name: Delete signing keychain
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP"/notarize-*

      # The notices job wrote it once for all legs.
      - name: Download the third-party notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
          path: notices

      # The archive name is built here and only here. STAGE goes through
      # GITHUB_ENV so the bash and the pwsh steps below read the same value:
      # the folder name inside dist/, which is also the archive's top folder.
      - name: Stage
        id: stage
        env:
          RELEASE_VERSION: ${{ needs.notes.outputs.version }}
        run: |
          set -euo pipefail
          name="rezzer-${RELEASE_VERSION}-${PLATFORM}"
          stage="dist/$name"
          mkdir -p "$stage"
          cp "target/$TARGET/release/$EXE" "$stage/"
          cp LICENSE README.md "$stage/"
          notices=notices/THIRD-PARTY-NOTICES.txt
          [ -s "$notices" ] || { echo "::error::$notices is missing or empty (artifact third-party-notices)"; exit 1; }
          cp "$notices" "$stage/"
          # A line of the copied Adobe license, not the summary at the top.
          grep -qF -- 'Copyright 1990-2023 Adobe' "$stage/THIRD-PARTY-NOTICES.txt" \
            || { echo "::error::$stage/THIRD-PARTY-NOTICES.txt lacks the Adobe CMap notice"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "STAGE=$name" >> "$GITHUB_ENV"

      - name: Package (tar.gz)
        if: ${{ matrix.archive_ext == 'tar.gz' }}
        working-directory: dist
        env:
          # macOS bsdtar would pack extended attributes as ._* AppleDouble entries.
          COPYFILE_DISABLE: "1"
        run: tar -czf "$STAGE.tar.gz" "$STAGE"

      - name: Package (zip)
        if: ${{ matrix.archive_ext == 'zip' }}
        shell: pwsh
        working-directory: dist
        # Not Compress-Archive: some Microsoft.PowerShell.Archive versions write
        # backslashes in entry names. ZipFile on .NET writes forward slashes,
        # and $true keeps the top folder.
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $here = Get-Location
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $here $env:STAGE), (Join-Path $here "$env:STAGE.zip"),
            [System.IO.Compression.CompressionLevel]::Optimal, $true)

      # The zip must keep the top folder and use forward slashes, as the
      # tar.gz archives do.
      - name: Check the zip contents
        if: ${{ matrix.archive_ext == 'zip' }}
        shell: pwsh
        working-directory: dist
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path (Get-Location) "$env:STAGE.zip"))
          try { $entries = @($zip.Entries | ForEach-Object { $_.FullName }) } finally { $zip.Dispose() }
          $entries | ForEach-Object { Write-Output $_ }
          $missing = @("$env:STAGE/$env:EXE", "$env:STAGE/LICENSE", "$env:STAGE/README.md",
            "$env:STAGE/THIRD-PARTY-NOTICES.txt" |
            Where-Object { $entries -cnotcontains $_ })
          if ($missing.Count -gt 0) { throw "$env:STAGE.zip lacks: $($missing -join ', ')" }

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rezzer-${{ matrix.platform }}
          path: dist/${{ steps.stage.outputs.name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  # One CycloneDX SBOM per platform, for the crates in that platform's
  # binary. Runs on a dispatch too, so the dry run proves them.
  sbom:
    name: generate the SBOMs
    needs: notes
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-cyclonedx reads the dependency graph through cargo metadata.
      - name: Install Rust toolchain
        run: |
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 rustup toolchain install
          rustup show active-toolchain

      # `fallback: none` fails the step rather than downloading an unpinned
      # binary. The second step is the same install and runs only after the
      # first one failed (a bad network day).
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        id: cyclonedx
        continue-on-error: true
        with:
          tool: cargo-cyclonedx@0.5.9
          fallback: none

      - name: Wait before the second try
        if: ${{ steps.cyclonedx.outcome == 'failure' }}
        run: sleep 30

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        if: ${{ steps.cyclonedx.outcome == 'failure' }}
        with:
          tool: cargo-cyclonedx@0.5.9
          fallback: none

      # No --target: the crates of all six targets must be in the registry.
      # cargo-cyclonedx has no --locked flag, so the fetch is locked here and
      # the run below is offline.
      - name: Fetch crates
        run: |
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 cargo fetch --locked

      # cargo-cyclonedx writes a file next to every workspace member's
      # Cargo.toml whatever --manifest-path says, so the crates/rezzer one is
      # kept and the rest removed, wherever a member lives (target, .git and
      # the sbom output folder are skipped). CARGO_NET_OFFLINE keeps cargo metadata off
      # the network; the diff check at the end proves the lockfile is
      # untouched.
      - name: Generate the SBOMs
        env:
          RELEASE_VERSION: ${{ needs.notes.outputs.version }}
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          mkdir -p sbom
          while read -r target platform; do
            [ -n "$platform" ] || continue
            name="rezzer-${RELEASE_VERSION}-${platform}.cdx"
            cargo cyclonedx --manifest-path crates/rezzer/Cargo.toml \
              --format json --spec-version 1.5 \
              --target "$target" --override-filename "$name"
            mv "crates/rezzer/${name}.json" "sbom/${name}.json"
            find . \( -path ./target -o -path ./.git -o -path ./sbom \) -prune \
              -o -type f -name "${name}.json" -exec rm -f -- {} +
          done <<< "$RELEASE_PLATFORMS"
          git diff --exit-code Cargo.lock

      # Cheap guards against an SBOM that is empty or describes the wrong
      # platform: windows-sys is only in the Windows graph, rxing (the
      # barcode reader) is in every binary.
      - name: Check the SBOMs
        env:
          RELEASE_VERSION: ${{ needs.notes.outputs.version }}
        run: |
          set -euo pipefail
          ls -la sbom
          want="$(awk 'NF { n++ } END { print n }' <<< "$RELEASE_PLATFORMS")"
          have="$(find sbom -name '*.cdx.json' | wc -l)"
          [ "$have" -eq "$want" ] || { echo "::error::$have SBOMs, expected $want"; exit 1; }
          has() { jq -e --arg c "$2" '[.components[].name] | index($c) != null' "$1" > /dev/null; }
          bad=0
          for f in sbom/*.cdx.json; do
            jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.5"
              and .metadata.component.name == "rezzer" and (.components | length) > 20' "$f" > /dev/null \
              || { echo "::error::$f is not a CycloneDX 1.5 SBOM of rezzer with its crates"; bad=1; }
            has "$f" rxing || { echo "::error::$f does not list rxing"; bad=1; }
            case "$f" in
              *-windows-*) has "$f" windows-sys || { echo "::error::$f does not list windows-sys"; bad=1; } ;;
              *-linux-*) ! has "$f" windows-sys || { echo "::error::$f lists windows-sys"; bad=1; } ;;
            esac
          done
          exit "$bad"

      # Not named rezzer-*: the archives are downloaded by that pattern.
      - name: Upload the SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: sbom/*.cdx.json
          if-no-files-found: error

  # Everything publish needs, built and checked on the dispatch too: the
  # archives and SBOMs, exactly the expected names for this run's version,
  # each archive's contents and SHA256SUMS over all of them. Uploads them as
  # one artifact, release-assets, which is all the tag jobs download besides
  # the Homebrew formula (its own artifact, homebrew-formula).
  collect:
    name: collect and check the release assets
    needs: [notes, build, sbom]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      platforms: ${{ steps.expected.outputs.platforms }}
    steps:
      # For scripts/ci/homebrew-formula.sh. First, because a checkout cleans
      # the workspace and would remove downloads/ and release/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The expected asset names, from RELEASE_PLATFORMS only. The matrix
      # for attest-sboms comes from here too, and is checked here, so its
      # shape is proven on the dispatch.
      - name: List the expected assets
        id: expected
        env:
          RELEASE_VERSION: ${{ needs.notes.outputs.version }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/expected.txt"
          : > "$RUNNER_TEMP/platforms.txt"
          while read -r _ platform; do
            [ -n "$platform" ] || continue
            case "$platform" in
              windows-*) ext=zip ;;
              *) ext=tar.gz ;;
            esac
            name="rezzer-${RELEASE_VERSION}-${platform}"
            printf '%s.%s\n%s.cdx.json\n' "$name" "$ext" "$name" >> "$RUNNER_TEMP/expected.txt"
            printf '%s %s.%s %s.cdx.json\n' "$platform" "$name" "$ext" "$name" >> "$RUNNER_TEMP/platforms.txt"
          done <<< "$RELEASE_PLATFORMS"
          cat "$RUNNER_TEMP/expected.txt"
          platforms="$(jq -Rnc '[inputs | split(" ") | {platform: .[0], archive: .[1], sbom: .[2]}]' \
            < "$RUNNER_TEMP/platforms.txt")"
          n="$(wc -l < "$RUNNER_TEMP/platforms.txt")"
          jq -e --argjson n "$n" 'length == $n and length > 0
            and all(.[]; (.platform | length) > 0 and (.archive | length) > 0 and (.sbom | length) > 0)' \
            <<< "$platforms" > /dev/null || { echo "::error::bad platform list: $platforms"; exit 1; }
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloads
          pattern: rezzer-*
          merge-multiple: true

      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: downloads

      # No extra, no missing name. An extra archive means the build matrix
      # has a leg RELEASE_PLATFORMS does not know.
      - name: Check the asset names
        run: |
          set -euo pipefail
          find downloads -type f -printf '%P\n' | sort > "$RUNNER_TEMP/found.txt"
          sort "$RUNNER_TEMP/expected.txt" > "$RUNNER_TEMP/expected-sorted.txt"
          if ! diff -u "$RUNNER_TEMP/expected-sorted.txt" "$RUNNER_TEMP/found.txt"; then
            echo "::error::the downloaded assets differ from RELEASE_PLATFORMS (- expected, + found)"
            exit 1
          fi

      # Each archive holds one folder, rezzer-<version>-<platform>/, with
      # the binary, LICENSE, README.md and THIRD-PARTY-NOTICES.txt and
      # nothing else. Nothing unpacked here runs.
      - name: Check the archive contents
        run: |
          set -euo pipefail
          bad=0
          while read -r platform archive _; do
            name="${archive%.tar.gz}"
            name="${name%.zip}"
            dir="$RUNNER_TEMP/unpack/$platform"
            mkdir -p "$dir"
            case "$archive" in
              *.zip) unzip -q "downloads/$archive" -d "$dir"; exe=rezzer.exe ;;
              *) tar -xzf "downloads/$archive" -C "$dir"; exe=rezzer ;;
            esac
            top="$(find "$dir" -mindepth 1 -maxdepth 1 -printf '%f\n')"
            if [ "$top" != "$name" ]; then
              echo "::error::$archive holds '$top', expected the single folder $name"
              bad=1
              continue
            fi
            got="$(find "$dir/$name" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')"
            want="$(printf '%s\n' "$exe" LICENSE README.md THIRD-PARTY-NOTICES.txt | sort | tr '\n' ' ')"
            echo "$archive: $got"
            [ "$got" = "$want" ] || { echo "::error::$archive holds '$got', expected '$want'"; bad=1; continue; }
            for f in "$exe" LICENSE README.md THIRD-PARTY-NOTICES.txt; do
              [ -f "$dir/$name/$f" ] && [ -s "$dir/$name/$f" ] \
                || { echo "::error::$archive: $name/$f is not a file or empty"; bad=1; }
            done
            if [ "$exe" = rezzer ] && [ ! -x "$dir/$name/rezzer" ]; then
              echo "::error::$archive: $name/rezzer is not executable"
              bad=1
            fi
          done < "$RUNNER_TEMP/platforms.txt"
          exit "$bad"

      - name: Generate checksums
        run: |
          set -euo pipefail
          mkdir -p release
          cp downloads/* release/
          cd release
          sha256sum -- *.tar.gz *.zip *.cdx.json > SHA256SUMS
          cat SHA256SUMS
          want="$(wc -l < "$RUNNER_TEMP/expected.txt")"
          have="$(wc -l < SHA256SUMS)"
          [ "$have" -eq "$want" ] || { echo "::error::SHA256SUMS has $have lines, expected $want"; exit 1; }
          sha256sum -c SHA256SUMS
          ls -la

      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

      # The cosign install of the publish job, rehearsed, so the tag runs no
      # install for the first time. Same pins and the same retry.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        id: cosign
        continue-on-error: true
        with:
          cosign-release: v3.1.4

      - name: Wait before the second try
        if: ${{ steps.cosign.outcome == 'failure' }}
        run: sleep 30

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ steps.cosign.outcome == 'failure' }}
        with:
          cosign-release: v3.1.4

      - name: Check the cosign version
        run: |
          set -euo pipefail
          out="$(cosign version 2>&1)"
          echo "$out"
          grep -qE '^GitVersion:[[:space:]]+v3\.1\.4$' <<< "$out" \
            || { echo "::error::cosign is not v3.1.4"; exit 1; }

      # The Homebrew formula from this run's SHA256SUMS, on the dispatch too
      # (with v0.0.0-dev), so the dry run shows the file the tap gets. Its
      # own artifact, not in release-assets, so it does not become a
      # release asset. The homebrew job renders it again from the
      # published SHA256SUMS and checks it is this file.
      - name: Render the Homebrew formula
        env:
          RELEASE_VERSION: ${{ needs.notes.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homebrew-formula"
          formula="$RUNNER_TEMP/homebrew-formula/rezzer.rb"
          scripts/ci/homebrew-formula.sh "$RELEASE_VERSION" release/SHA256SUMS > "$formula"
          ruby --version
          ruby -c "$formula"
          cat "$formula"

      - name: Upload the Homebrew formula
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: ${{ runner.temp }}/homebrew-formula/rezzer.rb
          if-no-files-found: error

  # Each platform's SBOM, attested against its archive. One leg per entry of
  # RELEASE_PLATFORMS (through collect). The legs run on the dispatch too and
  # check their files; only the attestation itself waits for a tag push.
  attest-sboms:
    name: attest the SBOM (${{ matrix.platform }})
    needs: [notes, collect]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # id-token and attestations: keyless signing of the attestation
    # (Sigstore through GitHub's OIDC token) and storing it, nothing else.
    permissions:
      contents: read # as the actions/attest README asks
      id-token: write # Sigstore signing of the attestation
      attestations: write # store the attestation
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.collect.outputs.platforms) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      # The attest action fails only when a whole subject list matches
      # nothing; these are plain paths, checked first, also against
      # SHA256SUMS. This is the same download publish does, so the dispatch
      # proves it.
      - name: Check the subject and the SBOM exist
        env:
          ARCHIVE: ${{ matrix.archive }}
          SBOM: ${{ matrix.sbom }}
        run: |
          set -euo pipefail
          for f in "$ARCHIVE" "$SBOM"; do
            [ -s "release/$f" ] || { echo "::error::missing release/$f"; exit 1; }
          done
          cd release
          for f in "$ARCHIVE" "$SBOM"; do
            line="$(awk -v f="$f" '$2 == f' SHA256SUMS)"
            [ -n "$line" ] || { echo "::error::$f is not in SHA256SUMS"; exit 1; }
            printf '%s\n' "$line" > "$RUNNER_TEMP/one.sha256"
            sha256sum -c "$RUNNER_TEMP/one.sha256"
          done

      - name: Attest the SBOM
        if: ${{ needs.notes.outputs.publish == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: release/${{ matrix.sbom }}
          subject-path: release/${{ matrix.archive }}

  publish:
    name: publish release
    needs: [notes, collect, attest-sboms]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Only a tag push, never a dispatch (see the notes job).
    if: ${{ needs.notes.outputs.publish == 'true' }}
    # contents: write creates the release. id-token: keyless signing of
    # SHA256SUMS and of the provenance attestation (Sigstore through GitHub's
    # OIDC token). attestations: storing the attestation. Nothing else.
    permissions:
      contents: write # create the release
      id-token: write # Sigstore signing of SHA256SUMS and the attestation
      attestations: write # store the attestation
    steps:
      # For release-notes/<tag>.md only. Nothing from the tree runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checked by collect, also on the dispatch: the archive and the SBOM
      # of every platform in RELEASE_PLATFORMS and SHA256SUMS over them.
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        id: cosign
        continue-on-error: true
        with:
          cosign-release: v3.1.4

      - name: Wait before the second try
        if: ${{ steps.cosign.outcome == 'failure' }}
        run: sleep 30

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ steps.cosign.outcome == 'failure' }}
        with:
          cosign-release: v3.1.4

      # A keyless Sigstore bundle (certificate, signature and transparency
      # log proof in one file) for SHA256SUMS, checked right away against
      # this workflow's identity. Users verify with the same verify-blob
      # call and the tag's ref.
      - name: Sign SHA256SUMS
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS
          cosign verify-blob release/SHA256SUMS \
            --bundle release/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # Build provenance for every release asset in one attestation: the
      # archives, the SBOMs, SHA256SUMS and its signature bundle, so the
      # attested files are exactly the uploaded ones. Verify with
      # `gh attestation verify <file> --repo jordiboehme/rezzer`. Before the
      # release is created, so a failed attestation stops the release rather
      # than leaving it published without provenance.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      # The release body is release-notes/<tag>.md from the tagged tree (the
      # `notes` job already checked it). The release name stays the plain
      # version; the motto heading leads the page itself.
      # A pre-release (notes' prerelease output, for example v0.2.0-rc.1)
      # is created with --prerelease, so GitHub never shows it as the latest
      # release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.notes.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag
                --notes-file "release-notes/${GITHUB_REF_NAME}.md")
          case "$PRERELEASE" in
            true) args+=(--prerelease) ;;
            false) ;;
            *) echo "::error::prerelease output is '$PRERELEASE', expected true or false"; exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" release/* "${args[@]}"

  # Writes Formula/rezzer.rb in jordiboehme/homebrew-tap once the release
  # exists. Only a tag push, never a dispatch (see the notes job): there is
  # no dev channel, and only this job writes the tap file. The formula is
  # rendered with the script collect runs on the dispatch, now from the
  # published SHA256SUMS, and must equal collect's homebrew-formula artifact.
  # A re-run after a push that already landed finds the tap current and
  # stops green.
  # A pre-release tag (v0.2.0-rc.1) never reaches the tap: no dev channel,
  # the job is skipped (notes' prerelease output).
  # This job is the tap-push exception of the rule that no step may first
  # run at the tag: it needs the published release and the tap token. The
  # parts that can be rehearsed, the script and `ruby -c`, run in collect
  # on every dispatch.
  homebrew:
    name: update the Homebrew tap
    needs: [notes, publish]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: ${{ needs.notes.outputs.publish == 'true' && needs.notes.outputs.prerelease == 'false' }}
    # The protected release environment holds TAP_GITHUB_TOKEN, a
    # fine-grained token with contents write on jordiboehme/homebrew-tap only.
    environment:
      name: release
      deployment: false
    # Reading the release of this repository. The tap push uses the token.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # For scripts/ci. Nothing else from the tree runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --clobber: a try after a failed one overwrites what it left behind.
      - name: Download the published SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.notes.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 gh release download "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/release" --clobber

      - name: Download the formula collect rendered
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-formula
          path: ${{ runner.temp }}/collect

      - name: Render the formula from the published SHA256SUMS
        env:
          RELEASE_VERSION: ${{ needs.notes.outputs.version }}
        run: |
          set -euo pipefail
          formula="$RUNNER_TEMP/rezzer.rb"
          scripts/ci/homebrew-formula.sh "$RELEASE_VERSION" "$RUNNER_TEMP/release/SHA256SUMS" > "$formula"
          ruby -c "$formula"
          if ! diff -u "$RUNNER_TEMP/collect/rezzer.rb" "$formula"; then
            echo "::error::the formula from the published SHA256SUMS differs from the one collect rendered (- collect, + published)"
            exit 1
          fi
          cat "$formula"

      # The token never goes into a URL or onto a command line: retry.sh
      # prints its command on a failed try, and a URL would keep the token
      # in .git/config. Git asks the credential helper below, which reads the
      # token from this step's environment when git runs it; the clone's
      # config holds only the helper text. GitHub masks the secret in logs.
      # Another push to the tap can land first: a rejected push rebases onto
      # the tap's newer commit and tries again, five times at most. What is
      # written does not change.
      - name: Push the formula to the tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.notes.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_GITHUB_TOKEN:-}" ]; then
            echo "::error::TAP_GITHUB_TOKEN is not set in the release environment"
            exit 1
          fi
          version="${RELEASE_VERSION#v}"
          tap="$RUNNER_TEMP/homebrew-tap"
          # $1 and the token are expanded by git when it runs the helper.
          # shellcheck disable=SC2016
          helper='!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=$TAP_GITHUB_TOKEN"; }; f'
          # Each try starts without the folder a failed try may leave.
          # shellcheck disable=SC2016
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 bash -c \
            'rm -rf "$2" && git -c credential.helper="$1" clone https://github.com/jordiboehme/homebrew-tap.git "$2"' \
            _ "$helper" "$tap"
          cd "$tap"
          git config credential.helper "$helper"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Formula
          cp "$RUNNER_TEMP/rezzer.rb" Formula/rezzer.rb
          git add Formula/rezzer.rb
          if git diff --cached --quiet; then
            echo "Formula/rezzer.rb in the tap is already rezzer $version, nothing to push"
            exit 0
          fi
          git commit -m "Update rezzer to ${version}"
          tries=5
          for attempt in $(seq "$tries"); do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq "$tries" ]; then
              break
            fi
            echo "::warning::push rejected (attempt $attempt of $tries), rebasing onto the tap and trying again"
            sleep $((attempt * 5))
            # The fetch is the network part and is retried; the rebase is
            # local, so a failure there is a real conflict.
            if ! "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 3 git fetch origin; then
              echo "::error::could not fetch the tap"
              exit 1
            fi
            if ! git rebase '@{upstream}'; then
              git rebase --abort || true
              echo "::error::could not rebase Formula/rezzer.rb onto the tap"
              exit 1
            fi
          done
          echo "::error::could not push Formula/rezzer.rb to the tap after $tries tries"
          exit 1
