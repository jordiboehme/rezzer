[workspace]
resolver = "3"
members = [
    "crates/rezzer-model",
    "crates/rezzer-limits",
    "crates/rezzer-detect",
    "crates/rezzer-enrich",
    "crates/rezzer-render",
    "crates/rezzer-pipeline",
    "crates/rezzer-cli",
    "crates/rezzer-mcp",
    "crates/formats/textenc",
    "crates/formats/csvsniff",
    "crates/formats/zipguard",
    "crates/formats/formulakit",
    "crates/formats/sheetparts",
    "crates/readers/rezzer-read-text",
    "crates/readers/rezzer-read-markdown",
    "crates/readers/rezzer-read-csv",
    "crates/readers/rezzer-read-sheet",
    "crates/rezzer",
]
# The fuzz targets are their own cargo-fuzz project (nightly only).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.99.0"

[workspace.dependencies]
rmcp = { version = "=3.5.1", default-features = false }
clap = "=4.6.7"
serde = "=1.0.229"
serde_json = "=1.0.154"
thiserror = "=2.0.21"
sha2 = "=0.11.1"
memmap2 = "=0.9.11"
chardetng = "=1.0.0"
encoding_rs = "=0.8.42"
pulldown-cmark = { version = "=0.13.4", default-features = false }
csv = "=1.4.0"
whatlang = "=0.18.0"
tokio = "=1.54.0"
schemars = "=1.2.3"
toml = "=1.1.8"
saphyr-parser = "=0.2.2"
directories = "=6.0.0"
hex = "=0.4.3"
anyhow = "=1.0.104"
insta = "=1.49.0"
tempfile = "=3.27.0"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
zip = { version = "=9.0.5", default-features = false }
cfb = "=0.15.0"
libc = "=0.2.191"
flate2 = { version = "=1.1.10", default-features = false }
base64 = "=0.23.1"
percent-encoding = "=2.3.2"
formualizer-parse = { version = "=4.0.0", default-features = false }
quick-xml = "=0.42.0"
calamine = { version = "=0.37.0", default-features = false }

# The time-limit tests push tens of megabytes through the pipeline. Unoptimized code would
# measure the build profile, not the limit, so debug and test builds are lightly optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
